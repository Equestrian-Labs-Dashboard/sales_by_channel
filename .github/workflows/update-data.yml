name: Update sales-by-channel data

on:
  schedule:
    - cron: "0 9 * * *"   # daily at 09:00 UTC — adjust to the real cadence
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dateutil

      # TODO: add scripts/fetch_sales_by_channel.py that:
      #   1. Calls the Shopify Admin API for each brand's store
      #      (SHOPIFY_CORRO_DOMAIN / SHOPIFY_CAVALI_DOMAIN) for gross_sales,
      #      discounts and orders per channel.
      #   2. Calls the QuickBooks Online API (reusing the OAuth2 flow already set up
      #      for the AP dashboard) for COGS and per-channel expenses, and computes
      #      margin1_pct / margin2_pct / margin3_pct.
      #   3. Writes the result into data/sales-channels.json, keeping the current
      #      { "channels": { "<period>": { "corro": [...], "cavali": [...] } } } shape.
      - name: Fetch and build data
        env:
          SHOPIFY_CORRO_DOMAIN: ${{ secrets.SHOPIFY_CORRO_DOMAIN }}
          SHOPIFY_CORRO_TOKEN: ${{ secrets.SHOPIFY_CORRO_TOKEN }}
          SHOPIFY_CAVALI_DOMAIN: ${{ secrets.SHOPIFY_CAVALI_DOMAIN }}
          SHOPIFY_CAVALI_TOKEN: ${{ secrets.SHOPIFY_CAVALI_TOKEN }}
          QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
          QBO_REFRESH_TOKEN: ${{ secrets.QBO_REFRESH_TOKEN }}
        run: |
          echo "TODO: python scripts/fetch_sales_by_channel.py"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sales-channels.json
          git diff --cached --quiet || git commit -m "chore: refresh sales-by-channel data"
          git push
